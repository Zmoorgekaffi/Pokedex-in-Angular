<a
  [routerLink]="['/pokemon', item().id]"
  class="flex flex-col items-center gap-1 rounded-lg border border-neutral-200 p-3 transition hover:border-neutral-400 hover:shadow-sm"
>
  <img [src]="item().spriteUrl" [alt]="item().name" loading="lazy" class="h-20 w-20 object-contain" />
  <span class="text-xs text-neutral-400">#{{ item().id.toString().padStart(3, '0') }}</span>
  <span class="text-sm font-medium capitalize">{{ item().name }}</span>
</a>
