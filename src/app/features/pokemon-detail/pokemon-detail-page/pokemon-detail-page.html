@if (isLoading()) {
  <p class="p-6 text-sm text-neutral-500">Lädt…</p>
} @else if (error()) {
  <p class="p-6 text-sm text-red-600">Fehler beim Laden.</p>
} @else if (pokemon(); as pokemon) {
  <app-pokemon-header
    [name]="displayName()"
    [id]="pokemon.id"
    [spriteUrl]="spriteUrl()"
    [types]="types()"
  />

  <app-type-effectiveness
    [weak]="typeEffectiveness().weak"
    [resistant]="typeEffectiveness().resistant"
    [immune]="typeEffectiveness().immune"
  />

  <app-base-stats [stats]="pokemon.stats" />

  <app-abilities-list [abilities]="pokemon.abilities" />
}
