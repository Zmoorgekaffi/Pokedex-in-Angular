<div class="flex flex-col gap-2 p-4">
  <div class="flex flex-wrap items-center gap-2">
    <select
      #methodSelect
      [value]="methodFilter() ?? ''"
      (change)="onMethodChange($any($event.target).value)"
      class="rounded-md border border-neutral-300 px-2 py-1.5 text-sm"
    >
      <option value="">{{ methodPlaceholder() }}</option>
      @for (method of availableMethods(); track method) {
        <option [value]="method">{{ learnMethodLabel(method) }}</option>
      }
    </select>

    @if (showLevelFilter()) {
      <input
        type="number"
        min="1"
        [value]="levelFilter() ?? ''"
        (input)="onLevelInput($any($event.target).value)"
        [placeholder]="levelPlaceholder()"
        class="w-24 rounded-md border border-neutral-300 px-2 py-1.5 text-sm"
      />
    }
  </div>

  @if (isLoadingTypes()) {
    <p class="p-2 text-sm text-neutral-500">…</p>
  } @else {
    <div class="flex flex-col divide-y divide-neutral-200 border-y border-neutral-200">
      @for (group of groupedByType(); track group.type) {
        <div>
          <button
            type="button"
            (click)="toggleType(group.type)"
            class="flex w-full items-center justify-between px-2 py-2 text-sm"
          >
            <span class="flex items-center gap-2">
              <span
                class="rounded-full px-2 py-0.5 text-xs capitalize"
                [style.background-color]="typeColor(group.type)"
                [style.color]="typeTextColor(group.type)"
              >{{ typeLabel(group.type) }}</span>
              <span class="text-neutral-400">{{ group.rows.length }}</span>
            </span>
            <span>{{ isExpanded(group.type) ? '▲' : '▼' }}</span>
          </button>

          @if (isExpanded(group.type)) {
            <div class="flex flex-col divide-y divide-neutral-100">
              @for (row of group.rows; track row.id + '|' + row.method + '|' + row.level) {
                <a
                  [routerLink]="['/move', row.id]"
                  (mouseenter)="onRowEnter(row, $event)"
                  (mousemove)="onRowMove($event)"
                  (mouseleave)="onRowLeave()"
                  class="flex items-center justify-between py-2 pr-2 pl-6 text-sm hover:bg-neutral-50"
                >
                  <span class="capitalize">{{ displayMoveName(row) }}</span>
                  <span class="text-neutral-500">{{ requirementLabel(row) }}</span>
                </a>
              }
            </div>
          }
        </div>
      }
    </div>
  }
</div>

<app-move-tooltip [moveName]="hoveredMoveName()" [x]="hoverX()" [y]="hoverY()" />
