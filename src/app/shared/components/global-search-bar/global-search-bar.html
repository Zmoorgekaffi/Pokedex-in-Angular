<div class="relative w-full max-w-sm">
  <input
    type="search"
    [value]="query()"
    (input)="onInput($any($event.target).value)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    placeholder="Pokémon suchen (Name DE/EN oder Nummer)…"
    class="w-full rounded-md border border-neutral-300 px-3 py-1.5 text-sm"
  />

  @if (isOpen() && query().trim()) {
    <div class="absolute z-20 mt-1 w-full rounded-md border border-neutral-300 bg-white shadow-md">
      @if (isLoading()) {
        <p class="px-3 py-2 text-sm text-neutral-500">Suchindex wird geladen…</p>
      } @else if (matches().length === 0) {
        <p class="px-3 py-2 text-sm text-neutral-500">Keine Treffer</p>
      } @else {
        <ul>
          @for (entry of matches(); track entry.id) {
            <li>
              <button
                type="button"
                (mousedown)="selectEntry(entry)"
                class="flex w-full items-center justify-between px-3 py-1.5 text-left text-sm hover:bg-neutral-100"
              >
                <span class="capitalize">{{ displayName(entry) }}</span>
                <span class="text-neutral-400">#{{ entry.id }}</span>
              </button>
            </li>
          }
        </ul>
      }
    </div>
  }
</div>
